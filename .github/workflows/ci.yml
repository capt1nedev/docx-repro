name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and verification tools
        run: python -m pip install build ruff mammoth==1.13.0
      - name: Check style
        run: |
          ruff check .
          ruff format --check .
      - name: Build package
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --no-deps --no-index --find-links dist docx-repro
      - name: Test installed package
        run: python -m unittest discover -s tests -t . -v
      - name: Exercise installed CLI
        run: |
          python examples/generate_demo.py demo
          docx-repro demo/large.docx --check-config demo/check.json --out demo/reduced.docx
