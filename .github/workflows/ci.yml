name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and verification tools
        run: python -m pip install build ruff twine mammoth==1.13.0
      - name: Check style
        run: |
          ruff check .
          ruff format --check .
      - name: Build package
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Install built wheel
        run: python -m pip install --no-deps --no-index --find-links dist docx-repro
      - name: Test installed package
        run: python -m unittest discover -s tests -t . -v
      - name: Exercise installed CLI
        run: |
          docx-repro-demo demo
      - name: Exercise synthetic missing-image checker
        run: |
          python examples/make_mammoth_170_case.py image-case
          docx-repro image-case/synthetic.docx --check-config image-case/check.json --out image-case/reduced.docx
