[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-repro"
version = "0.1.2"
description = "Reduce DOCX parser bug reports while preserving a user-defined symptom."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "capt1nedev"}]
keywords = ["docx", "debugging", "delta-debugging", "ooxml", "reproduction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
demo = ["mammoth==1.13.0"]
mammoth = ["mammoth>=1.11.0"]
dev = ["build>=1.2", "ruff>=0.11"]

[project.scripts]
docx-repro = "docx_repro.cli:main"
docx-repro-demo = "docx_repro.demo:main"

[project.urls]
Repository = "https://github.com/capt1nedev/docx-repro"
Issues = "https://github.com/capt1nedev/docx-repro/issues"
Documentation = "https://github.com/capt1nedev/docx-repro#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
